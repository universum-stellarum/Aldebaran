services:
  config-server:
    image: ${CONFIG_SERVER_IMAGE:-universum-config-server:local}
    build:
      context: .
    restart: unless-stopped
    # Dokploy writes these deployment-specific values into .env beside compose.yml.
    # raw preserves $ in bcrypt hashes and secrets (Docker Compose >= 2.30).
    env_file:
      - path: .env
        required: true
        format: raw
    environment:
      APP_ENV: ${APP_ENV:?APP_ENV must be dev or prod}
      SERVER_PORT: ${SERVER_PORT:-8888}
    expose:
      - "${SERVER_PORT:-8888}"
    networks:
      - dokploy-network
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "/bin/bash", "/app/healthcheck.sh"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
networks:
  dokploy-network:
    external: true
