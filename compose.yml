services:
  config-server:
    image: aldebaran:local
    build:
      context: .
    restart: unless-stopped
    environment:
      HOME: /tmp
      JAVA_TOOL_OPTIONS: "-Duser.home=/tmp"
      SERVER_PORT: ${SERVER_PORT:-8888}
      CONFIG_GIT_URI: ${CONFIG_GIT_URI:?Informe a URL HTTPS do repositório privado}
      CONFIG_GIT_USERNAME: ${CONFIG_GIT_USERNAME:?Informe o usuário do Git}
      CONFIG_GIT_TOKEN: ${CONFIG_GIT_TOKEN:?Informe o token do Git}
      CONFIG_GIT_DEFAULT_LABEL: ${CONFIG_GIT_DEFAULT_LABEL:-main}
      ENCRYPT_KEY: ${ENCRYPT_KEY:?Informe a chave de criptografia}
      CONFIG_ADMIN_USERNAME: ${CONFIG_ADMIN_USERNAME:?Informe o usuário administrativo}
      CONFIG_ADMIN_PASSWORD: ${CONFIG_ADMIN_PASSWORD:?Informe a senha administrativa}
    ports:
      - target: ${SERVER_PORT:-8888}
        published: "${SERVER_PORT:-8888}"
        host_ip: ${CONFIG_SERVER_BIND_IP:?Informe o IP da interface Tailscale do host}
        protocol: tcp
    read_only: true
    # JVM e clone/cache Git precisam de um diretório gravável; perdido ao recriar o container.
    tmpfs:
      - /tmp:size=256m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "/bin/bash", "/app/healthcheck.sh"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
