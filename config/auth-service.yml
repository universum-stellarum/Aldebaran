spring:
  datasource:
    url: jdbc:postgresql://${DIST_AUTH_SERVICE_DATABASE_HOST}:${DIST_AUTH_SERVICE_DATABASE_PORT}/${DIST_AUTH_SERVICE_DATABASE_NAME}
    username: ${DIST_AUTH_SERVICE_DATABASE_USERNAME}
    password: ${DIST_AUTH_SERVICE_DATABASE_PASSWORD}
  data:
    redis:
      host: ${DIST_AUTH_SERVICE_REDIS_HOST}
      port: 6379
      password: ${DIST_AUTH_SERVICE_REDIS_PASSWORD}
universum:
  jwt:
    secret: ${DIST_AUTH_SERVICE_JWT_SECRET}
    expiration-seconds: 900
  services:
    notification-url: ${DIST_AUTH_SERVICE_NOTIFICATION_URL}
