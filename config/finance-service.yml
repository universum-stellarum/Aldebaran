spring:
  datasource:
    url: jdbc:postgresql://${DIST_FINANCE_SERVICE_DATABASE_HOST}:${DIST_FINANCE_SERVICE_DATABASE_PORT}/${DIST_FINANCE_SERVICE_DATABASE_NAME}
    username: ${DIST_FINANCE_SERVICE_DATABASE_USERNAME}
    password: ${DIST_FINANCE_SERVICE_DATABASE_PASSWORD}
universum:
  services:
    auth-url: ${DIST_FINANCE_SERVICE_AUTH_URL}
  business:
    default-currency: BRL
    reconciliation-enabled: true
