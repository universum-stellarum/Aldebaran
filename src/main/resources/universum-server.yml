spring:
  application:
    name: universum-config-server
  profiles:
    include: native
  cloud:
    config:
      server:
        accept-empty: false
        health:
          enabled: false
        encrypt:
          enabled: false
        native:
          search-locations: file:./config/
          add-label-locations: false
  mvc:
    log-request-details: false
server:
  port: ${SERVER_PORT:8888}
  forward-headers-strategy: none
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: false
      show-details: never
      show-components: never
logging:
  structured:
    format:
      console: logstash
  level:
    org.springframework.cloud.config.server.environment: ERROR
    org.springframework.web: WARN
    org.springframework.security: WARN
universum:
  config-directory: ./config
